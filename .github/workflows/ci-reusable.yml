name: Reusable CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or SHA to validate
        required: true
        type: string
      checkout_repository:
        description: Repository that contains the ref to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Nested `npm install` during pnpm git-dep prepare (matches former `npm ci --legacy-peer-deps`).
      npm_config_legacy_peer_deps: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.checkout_ref }}
          repository: ${{ inputs.checkout_repository }}
          persist-credentials: false

      # pnpm/action-setup is deprecated for pnpm ≥11; use pnpm/setup (installs pnpm only;
      # Node comes from setup-node + .nvmrc below).
      - name: Setup pnpm
        uses: pnpm/setup@00e6b8420246ccf1cdb9825b4a0e59d1ec4072ab # v2.0.1
        with:
          version: 11.18.0
          install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test
