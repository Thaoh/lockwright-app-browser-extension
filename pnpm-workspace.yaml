# Single-package workspace. pnpm v11 reads project settings from this file
# (not package.json#pnpm / non-auth .npmrc keys).

strictPeerDependencies: false
autoInstallPeers: true

# Nested UI-kit deps (e.g. react-strict-dom) are resolved via require.resolve paths.
publicHoistPattern:
  - '*react-strict-dom*'
  - '*react-native*'

overrides:
  react-native: 0.79.5
  react-native>@types/react: 18.3.0
  react-native-windows>react: 19.1.0

# Lifecycle scripts (pre/postinstall, prepare, etc.) are denied by default.
# Only packages listed here may run build scripts. Add entries deliberately.
# Git-hosted packages require name@tarball-url keys (pnpm v11).
allowBuilds:
  "@tetherto/pear-apps-lib-feedback@https://codeload.github.com/tetherto/pear-apps-lib-feedback/tar.gz/870e741f0ebf23c1da461d8f70d99ff461f548eb": true
