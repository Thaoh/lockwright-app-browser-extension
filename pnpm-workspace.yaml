# Non-auth pnpm settings live here (pnpm ≥11 ignores them in .npmrc / package.json#pnpm).
autoInstallPeers: true
strictPeerDependencies: false
minimumReleaseAge: 1440

# Equivalent of former npm overrides (nested form → selector syntax).
overrides:
  'react-native-windows>react': 19.1.0
  react-native: 0.79.5
  'react-native>@types/react': 18.3.0

# Lifecycle scripts blocked by default. Git @tetherto packages run prepare/build.
# Keys use name@codeload URL (pnpm git-dep matcher); update SHAs when git deps move.
allowBuilds:
  esbuild: true
  husky: true
